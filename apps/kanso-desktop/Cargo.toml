[package]
name = "kanso-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kanso_desktop"
path = "src/lib.rs"

[[bin]]
name = "kanso-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
gpui-kit.workspace = true
kanso-config = { path = "../../crates/kanso-config" }
kanso-core = { path = "../../crates/kanso-core" }
kanso-engine = { path = "../../crates/kanso-engine" }
kanso-storage = { path = "../../crates/kanso-storage" }
kanso-usage = { path = "../../crates/kanso-usage" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
