[workspace]
members = [
    "crates/kanso-core",
    "crates/kanso-engine",
    "crates/kanso-storage",
    "crates/kanso-ci",
    "crates/kanso-mcp",
    "crates/kanso-runner",
    "apps/kanso-desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Kanso Contributors"]

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
fastcdc = "3.2"
iced = { version = "0.14", features = ["tokio"] }
notify = "8.0"
notify-debouncer-mini = "0.6"
rayon = "1.10"
rfd = "0.18"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.16"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.15", features = ["v4", "serde"] }
wait-timeout = "0.2"
zstd = "0.13"
